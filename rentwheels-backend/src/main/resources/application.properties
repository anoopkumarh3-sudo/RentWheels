# ===================================================================
# RentWheels Spring Boot Backend Configuration
# ===================================================================

spring.application.name=rentwheels-backend
server.port=8080

# -------------------------------------------------------------------
# PostgreSQL Datasource Configuration (Supabase PostgreSQL)
# Values are injected dynamically via Environment Variables:
#   - SPRING_DATASOURCE_URL
#   - SPRING_DATASOURCE_USERNAME
#   - SPRING_DATASOURCE_PASSWORD
# No credentials are hardcoded.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.hhknvyvetypclkqsdfkr.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for Cloud PostgreSQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Enforce SSL on PostgreSQL Connection
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# ddl-auto=validate ensures Hibernate only validates existing tables.
# It will NEVER create, alter, drop, or duplicate Supabase tables.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Logging Configuration
# Suppress sensitive SQL parameters from logging
# -------------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.rentwheels=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
